spring:
  application:
    name: api

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL}
        max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:4096}
      embedding:
        api-key: ${OPENAI_API_KEY}
        model: ${OPENAI_TEXT_EMBEDDING_MODEL}
        dimensions: ${OPENAI_TEXT_EMBEDDING_DIMENSIONS}

    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        project-id: ${GOOGLE_GENAI_PROJECT_ID}
        location: ${GOOGLE_GENAI_LOCATION}
        chat:
          options:
            model: ${GOOGLE_GENAI_CHAT_MODEL}
            temperature: ${GOOGLE_GENAI_TEMPERATURE:0.7}
            max-tokens: ${GOOGLE_GENAI_MAX_TOKENS:4096}
        embedding:
          text:
            options:
              model: ${GOOGLE_GENAI_TEXT_EMBEDDING_MODEL}
          project-id: ${GOOGLE_GENAI_PROJECT_ID}
          location: ${GOOGLE_GENAI_LOCATION}
          api-key: ${GOOGLE_GENAI_API_KEY}

    vector-store:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION_NAME}
        use-tls: false
        initialize-schema: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual

frame-search:
  score-threshold: 0.00
  post-filter-multiplier: 3

snowflake:
  datacenter-id: 1
  worker-id: 10

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
    disable-favicon: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  enable-kotlin: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  prometheus:
    metrics:
      export:
        enabled: true

  endpoint:
    prometheus:
      access: unrestricted

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5,0.95,0.99

llm:
  retry:
    llm:
      max-attempts: 3
      initial-backoff-millis: 500
      backoff-multiplier: 2.0
      max-backoff-millis: 10000

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key}
  access-token-validity-in-ms: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-validity-in-ms: ${JWT_REFRESH_TOKEN_EXPIRATION}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
